        }

        .vatroc-logo {
            height: 50px;

        /* Starlux Virtual 風格導覽列樣式 */
        .starlux-nav {
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* 連結「跳一下」與底線動畫效果 */
        .nav-link {
            position: relative;
            display: inline-block;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #38bdf8;
            transition: width 0.3s ease;
        }

        .nav-link:hover {
            transform: translateY(-4px);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        /* 下拉式選單樣式 */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 12px;
            width: 220px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            z-index: 100;
            padding: 8px 0;
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: block;
            padding: 10px 16px;
            font-size: 13px;
            color: #cbd5e1;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding-left: 20px;
        }

        /* 社群按鈕放大特效 */
        .social-btn {
            background-color: #162032;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s ease, border-color 0.3s ease;

        .social-btn:hover {

        /* 贊助商 Logo 樣式 */

    <script>
        const GOOGLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQHAreEebnMznd65GIyzJner2QBguCsMxK72sxxaOo2YBHj93zKCvvyrwSpo4ALDqpn-oL_6sE1xBo/pub?gid=0&single=true&output=csv";
        const VATSIM_API = "https://data.vatsim.net/v3/vatsim-data.json";
        const categories = ["CTR", "APP", "TWR", "GND", "DEL"];

        async function updateRoster() {
            const statusBadge = document.getElementById('sync-status');
            try {
                const [csvRes, vatsimRes] = await Promise.all([
                    fetch(`${GOOGLE_CSV_URL}&_cb=${Date.now()}`, { cache: 'no-store' }),
                    fetch(VATSIM_API)
                ]);

                const csvText = await csvRes.text();
                const vatsimData = await vatsimRes.json();
                const onlineCids = new Set(vatsimData.controllers.map(c => String(c.cid)));

                const rows = csvText.split('\n').map(row => row.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
                const tableBody = document.getElementById('roster-table-body');
                tableBody.innerHTML = '';

                categories.forEach(cat => {
                    const filtered = rows.filter(r => r.length >= 5 && r[3].toUpperCase().includes(cat));
                    if (filtered.length > 0) {
                        tableBody.innerHTML += `<tr class="section-header"><td colspan="4" class="p-3 text-xs font-bold text-slate-200 uppercase tracking-widest pl-4">${cat} </td></tr>`;
                        filtered.forEach(r => {
                            const isOnline = onlineCids.has(r[1]);
                            tableBody.innerHTML += `
                                <tr class="hover:bg-white/5 transition-colors">
                                    <td class="p-4 font-bold text-sky-400 pl-6">
                                        ${r[0]} 
                                        ${isOnline ? '<span class="ml-3 bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[9px] font-black animate-pulse-light">● ONLINE</span>' : ''}
                                    </td>
                                    <td class="p-4 text-center text-slate-400 font-mono">${r[1]}</td>
                                    <td class="p-4 text-center text-slate-300 font-mono">${r[2]}</td>
                                    <td class="p-4 text-center text-slate-300">${r[3]}</td>
                                </tr>`;
                        });
                    }
                });
                statusBadge.textContent = "LIVE SYNCED";
                statusBadge.className = "text-[10px] bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded font-mono tracking-widest";
            } catch (e) {
                statusBadge.textContent = "SYNC ERROR";
                statusBadge.className = "text-[10px] bg-red-500/10 text-red-400 px-3 py-1 rounded font-mono tracking-widest";
            }
        }

        setInterval(updateRoster, 30000);
        updateRoster();
    </script>
</body>
</html>
