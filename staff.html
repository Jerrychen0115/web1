<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATROC - ATC Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { background-image: url('TP.png'); background-size: cover; background-position: center; background-attachment: fixed; font-family: 'Inter', sans-serif; color: #f8fafc; min-height: 100vh; position: relative; }
        body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); z-index: -1; }
        .glass-card { background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .vatroc-logo { height: 90px; width: auto; }
        th { background: rgba(0, 0, 0, 0.3); }
        .section-header { background: rgba(30, 41, 59, 0.6); }
        .animate-pulse-light { animation: pulse-light 2s infinite ease-in-out; }
        @keyframes pulse-light { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; transform: scale(1.03); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <nav class="flex justify-between items-center mb-12 max-w-7xl mx-auto relative z-10">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
            <img src="VATROC.png" alt="VATROC Logo" class="vatroc-logo">
        </div>
        <div class="hidden md:flex gap-8 text-sm font-medium text-white items-center">
            <a href="index.html" class="hover:text-blue-300">Main Page</a>
            <a href="staff.html" class="text-white underline decoration-blue-500 underline-offset-8 decoration-2">ATC center</a>
            <a href="https://ais.caa.gov.tw/eaip/" target="_blank" class="hover:text-blue-300">Pilot resources</a>
            <a href="joinatc.html" class="text-white underline decoration-blue-500 underline-offset-8 decoration-2">ATC training / Visiting</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto relative z-10">
        <div class="glass-card p-6 md:p-8 overflow-hidden">
            <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                <h2 class="text-3xl font-black text-white flex items-center gap-3">
                    <span class="w-2 h-8 bg-blue-500 rounded-full"></span> VATROC ATC Roster
                </h2>
                <div class="flex flex-col items-end gap-1">
                    <span id="next-sync" class="text-[9px] text-slate-400 font-mono">Syncing...</span>
                    <span id="sync-status" class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-1 rounded">LOADING</span>
                </div>
            </div>
            
            <table class="w-full text-left table-fixed border-collapse">
                <thead>
                    <tr class="text-[11px] text-slate-300 uppercase font-bold">
                        <th class="p-4 w-[30%] text-center">Name</th>
                        <th class="p-4 w-[20%] text-center">CID</th>
                        <th class="p-4 w-[20%] text-center">Grade</th>
                        <th class="p-4 w-[25%] text-center">Position</th>
                    </tr>
                </thead>
                <tbody id="roster-table-body" class="divide-y divide-white/5 font-medium text-sm"></tbody>
            </table>
        </div>
    </main>

    <script>
        // 🚨 請確認這裡放入的是你「發布到網路 -> 工作表1 -> CSV」後產生的新網址
        const BASE_GOOGLE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQHAreEebnMznd65GIyzJner2QBguCsMxK72sxxaOo2YBHj93zKCvvyrwSpo4ALDqpn-oL_6sE1xBo/pub?gid=0&single=true&output=csv";
        
        const categories = [
            { key: "CTR", title: "Area Control Center (CTR)" },
            { key: "APP", title: "Approach Control (APP)" },
            { key: "TWR", title: "Tower Control (TWR)" },
            { key: "GND", title: "Ground Control (GND)" },
            { key: "DEL", title: "Delivery Control (DEL)" }
        ];

        async function doSync() {
            const statusBadge = document.getElementById('sync-status');
            try {
                // 強制跳過快取
                const response = await fetch(`${BASE_GOOGLE_URL}&_cb=${Date.now()}`, { cache: 'no-store' });
                const csvText = await response.text();
                
                if (csvText.includes("<html")) throw new Error("Waiting for Google Cache...");

                const rows = csvText.split('\n').map(row => row.split(',').map(cell => cell.replace(/^"|"$/g, '').trim()));
                const tableBody = document.getElementById('roster-table-body');
                tableBody.innerHTML = '';

                categories.forEach(cat => {
                    const filtered = rows.filter(r => r.length >= 4 && r[3].toUpperCase().includes(cat.key));
                    if (filtered.length > 0) {
                        tableBody.innerHTML += `<tr class="section-header"><td colspan="4" class="p-3 text-xs font-bold text-slate-200 uppercase pl-4">${cat.title}</td></tr>`;
                        filtered.forEach(r => {
                            tableBody.innerHTML += `<tr><td class="p-4 pl-6 text-blue-400 font-bold">${r[0]}</td><td class="p-4 text-center text-slate-300 font-mono">${r[1]}</td><td class="p-4 text-center">${r[2]}</td><td class="p-4 text-center">${r[3]}</td></tr>`;
                        });
                    }
                });
                statusBadge.textContent = "SYNCED";
                statusBadge.className = "text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded";
            } catch (e) {
                statusBadge.textContent = "WAITING FOR SYNC...";
            }
        }

        setInterval(doSync, 15000);
        doSync();
    </script>
</body>
