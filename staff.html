<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATROC - ATC Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { background-image: url('TP.png'); background-size: cover; background-position: center; background-attachment: fixed; font-family: 'Inter', sans-serif; color: #f8fafc; min-height: 100vh; position: relative; }
        body::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.4); z-index: -1; }
        .glass-card { background: rgba(15, 23, 42, 0.3); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; }
        .section-header { background: rgba(30, 41, 59, 0.6); }
        .online-dot { animation: pulse-green 1.5s infinite; }
        @keyframes pulse-green { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <main class="max-w-7xl mx-auto relative z-10">
        <div class="glass-card p-6 md:p-8">
            <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                <h2 class="text-3xl font-black text-white">VATROC ATC Roster</h2>
                <div id="sync-status" class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-1 rounded">LOADING...</div>
            </div>
            
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-[11px] text-slate-300 uppercase font-bold">
                        <th class="p-4 w-[30%]">Name</th>
                        <th class="p-4 w-[20%]">CID</th>
                        <th class="p-4 w-[20%]">Grade</th>
                        <th class="p-4 w-[30%]">Position</th>
                    </tr>
                </thead>
                <tbody id="roster-table-body" class="divide-y divide-white/5 text-sm"></tbody>
            </table>
        </div>
    </main>

    <script>
        // 🚨 這裡填入你的正確 CSV 網址
        const GOOGLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQHAreEebnMznd65GIyzJner2QBguCsMxK72sxxaOo2YBHj93zKCvvyrwSpo4ALDqpn-oL_6sE1xBo/pub?gid=0&single=true&output=csv";
        const VATSIM_API = "https://data.vatsim.net/v3/vatsim-data.json";

        const categories = ["CTR", "APP", "TWR", "GND", "DEL"];

        async function updateRoster() {
            try {
                const [csvRes, vatsimRes] = await Promise.all([
                    fetch(`${GOOGLE_CSV_URL}&_cb=${Date.now()}`, { cache: 'no-store' }),
                    fetch(VATSIM_API)
                ]);

                const csvText = await csvRes.text();
                const vatsimData = await vatsimRes.json();
                const onlineCids = new Set(vatsimData.controllers.map(c => String(c.cid)));

                const rows = csvText.split('\n').map(row => row.split(',').map(c => c.replace(/^"|"$/g, '').trim()));
                const tableBody = document.getElementById('roster-table-body');
                tableBody.innerHTML = '';

                categories.forEach(cat => {
                    const filtered = rows.filter(r => r.length >= 4 && r[3].toUpperCase().includes(cat));
                    if (filtered.length > 0) {
                        tableBody.innerHTML += `<tr class="section-header"><td colspan="4" class="p-3 text-xs font-bold text-slate-200 uppercase">${cat} Group</td></tr>`;
                        filtered.forEach(r => {
                            const isOnline = onlineCids.has(r[1]);
                            tableBody.innerHTML += `
                                <tr class="hover:bg-white/5">
                                    <td class="p-4 font-bold text-blue-400">
                                        ${r[0]} 
                                        ${isOnline ? '<span class="ml-2 bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-[9px] font-black online-dot">● ONLINE</span>' : ''}
                                    </td>
                                    <td class="p-4 font-mono text-slate-400">${r[1]}</td>
                                    <td class="p-4 text-slate-300">${r[2]}</td>
                                    <td class="p-4 text-slate-300">${r[3]}</td>
                                </tr>`;
                        });
                    }
                });
                document.getElementById('sync-status').textContent = "LIVE SYNCED";
            } catch (e) {
                document.getElementById('sync-status').textContent = "SYNC ERROR";
            }
        }

        setInterval(updateRoster, 30000);
        updateRoster();
    </script>
</body>
</html>
